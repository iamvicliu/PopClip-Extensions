identifier: com.vicliu.popclip.currency-convert
popclip version: 4151
name:
  en: Currency & Crypto Converter
  zh-hans: 汇率与加密货币换算
  zh-hant: 匯率與加密貨幣換算
description:
  en: Convert fiat and cryptocurrency amounts in selected text with real-time exchange rates and automatic summation.
  zh-hans: 实时换算选中文本中的多国法币与主流加密货币金额，支持中文单位与多笔金额自动求和。
  zh-hant: 即時換算選取文字中的多國法幣與主流加密貨幣金額，支援中文單位與多筆金額自動求和。
keywords: currency money exchange rate forex crypto bitcoin btc eth sol usd cny jpy hkd eur gbp converter
entitlements: [network]
regex: '(?:(?<![A-Za-z0-9])(?:US\$|HK\$|NT\$|CA\$|A\$|S\$|NZ\$|CHF|RM|[\$€£¥￥₩₹₽฿₫₱])\s*\d+(?:,\d{3})*(?:\.\d+)?\s*(?:万|亿|[kKmMbB])?(?:\s*(?:USD|CNY|RMB|HKD|TWD|JPY|EUR|GBP|SGD|KRW|AUD|CAD|CHF|NZD|MYR|THB|VND|PHP|IDR|INR|RUB|AED|SAR|TRY|BRL|MXN|美元|美金|人民币|港币|港元|台币|新台币|日元|日圆|円|欧元|英镑|新币|韩元|韩币|澳元|加元|瑞郎|泰铢))?|(?<!\d)\d+(?:,\d{3})*(?:\.\d+)?\s*(?:万|亿|[kKmMbB])?\s*(?:(?:USD|CNY|RMB|HKD|TWD|JPY|EUR|GBP|SGD|KRW|AUD|CAD|CHF|NZD|MYR|THB|VND|PHP|IDR|INR|RUB|AED|SAR|TRY|BRL|MXN|BTC|ETH|SOL|BNB|XRP|DOGE|ADA|TON|TRX|AVAX|DOT|LINK|LTC|BCH|SHIB|SUI|PEPE|USDT|USDC)\b|(?:美元|美金|人民币|元|港币|港元|台币|新台币|日元|日圆|円|欧元|英镑|新币|新加坡元|韩元|韩币|澳元|澳币|加元|加币|瑞士法郎|瑞郎|马币|林吉特|泰铢|越南盾|卢布|卢比|迪拉姆)))'
actions:
  - title:
      en: Convert Currency
      zh-hans: 换算汇率
      zh-hant: 換算匯率
    icon: symbol:dollarsign.arrow.circlepath
    after: show-result
    javascript file: lookup.js
  - title:
      en: Open Rate Chart
      zh-hans: 汇率走势
      zh-hant: 匯率走勢
    icon: symbol:chart.line.uptrend.xyaxis
    javascript file: open.js
