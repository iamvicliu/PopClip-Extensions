identifier: com.vicliu.popclip.phone-lookup
popclip version: 4151
name:
  en: Phone Lookup
  zh-hans: 号码查询
  zh-hant: 號碼查詢
description:
  en: Extract and clean domestic or international phone numbers from selected text and look up their location, carrier, and caller-ID tags.
  zh-hans: 自动过滤选中文本中的空格、连字符和多余字符，查询国内外手机号或固话的归属地、运营商及骚扰/黄页标记。
  zh-hant: 自動過濾選取文字中的空格、連字號與多餘字元，查詢國內外手機號或固話的歸屬地、電信商及騷擾/黃頁標記。
entitlements: [network]
regex: '(?:(?<![\d+])\+[1-9]\d{0,2}(?: ?[\-—–()] ?| )?\d(?:(?: ?[\-—–()] ?| )?\d){5,13}|(?<!\d)(?:00[1-9]\d{0,2}(?: ?[\-—–()] ?| )?\d(?:(?: ?[\-—–()] ?| )?\d){5,13}|(?:86[ \-—–]+)?1[3-9]\d(?:[ \-—–]*\d){8}|\(?0(?:10|2\d|[3-9]\d{2})\)?[ \-—–]*\d{3,4}[ \-—–]*\d{4}|[48]00[ \-—–]*\d{3}[ \-—–]*\d{4}))(?!\d)'
actions:
  - title:
      en: Lookup Phone
      zh-hans: 查询号码
      zh-hant: 查詢號碼
    icon: symbol:phone
    after: show-result
    javascript file: lookup.js
  - title:
      en: Open in Baidu
      zh-hans: 百度详情
      zh-hant: 百度詳情
    icon: symbol:magnifyingglass
    javascript file: open.js
