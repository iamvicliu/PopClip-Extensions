identifier: com.vicliu.popclip.ip-lookup
popclip version: 4151
name:
  en: IP & Domain Lookup
  zh-hans: IP 与域名查询
  zh-hant: IP 與網域查詢
description:
  en: Look up location, ASN, DNS records, and RDAP expiration for IPv4, IPv6, domains, or URLs.
  zh-hans: 查询 IPv4、IPv6、域名或 URL 的归属地、ASN、DNS 解析记录及域名到期时间。
  zh-hant: 查詢 IPv4、IPv6、網域或 URL 的歸屬地、ASN、DNS 解析記錄及網域到期時間。
keywords: ip ipv4 ipv6 domain url dns whois rdap asn geoip
app:
  name: IPinfo
  link: https://ipinfo.io/
entitlements: [network]
regex: '^\s*(?:https?:\/\/)?\[?(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}|(?:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]+)|(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+(?:xn--[A-Za-z0-9]+|[A-Za-z]{2,24}))\]?(?::\d{1,5})?(?:\/[^\s,;)]*)?(?:\s*[,;\s]\s*(?:https?:\/\/)?\[?(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}|(?:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]+)|(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+(?:xn--[A-Za-z0-9]+|[A-Za-z]{2,24}))\]?(?::\d{1,5})?(?:\/[^\s,;)]*)?)*\s*$'
actions:
  - title:
      en: Lookup IP / Domain
      zh-hans: 查询 IP / 域名
      zh-hant: 查詢 IP / 網域
    icon: symbol:network
    after: show-result
    javascript file: lookup.js
  - title:
      en: Open Details
      zh-hans: 打开详情页
      zh-hant: 打開詳情頁
    icon: symbol:safari
    javascript file: open.js
